name: Feature request
description: Explain a workflow problem and a proposed improvement.
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Workflow problem
      description: What are you trying to do, and where does the current behavior fall short?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful improvement and alternatives you tried.
    validations:
      required: true
