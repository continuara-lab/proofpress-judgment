<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 502" width="840" height="502" role="img" aria-labelledby="title description">
  <title id="title">How Proofpress carries judgment across agent sessions</title>
  <desc id="description">An agent session supplies guidance and experience for a draft Agent Judgment Format record. A human edits or approves the draft. Later sessions get approved judgments when their task facts match. An optional host hook checks covered actions before execution.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 1l6 3-6 3" fill="none" stroke="#397580" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="839" height="501" rx="21" fill="#F8F7F3" stroke="#DADDD7"/>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif">
    <text x="32" y="35" fill="#336873" font-size="14" font-weight="700" letter-spacing="2">PROOFPRESS</text>
    <text x="32" y="68" fill="#1C292C" font-size="27" font-weight="700">How judgment carries across sessions</text>
    <g fill="#FFFFFF" stroke="#CFD8D5">
      <rect x="32" y="89" width="466" height="76" rx="12"/>
      <rect x="32" y="191" width="466" height="76" rx="12"/>
      <rect x="32" y="293" width="466" height="76" rx="12"/>
    </g>
    <rect x="32" y="395" width="466" height="76" rx="12" fill="#E7F2EB" stroke="#A2BEAD"/>
    <rect x="550" y="306" width="258" height="165" rx="12" fill="#E7F2F4" stroke="#A5C5CC"/>
    <g fill="none" stroke="#397580" stroke-width="1.6" marker-end="url(#arrow)">
      <path d="M57 167v20"/>
      <path d="M57 269v20"/>
      <path d="M57 371v20"/>
      <path d="M501 433h45"/>
    </g>
    <g font-size="15" fill="#336873" font-weight="700">
      <text x="49" y="121">01</text>
      <text x="49" y="223">02</text>
      <text x="49" y="325">03</text>
      <text x="49" y="427">04</text>
    </g>
    <g font-size="20" font-weight="700" fill="#1C292C">
      <text x="86" y="121">Agent session</text>
      <text x="86" y="223">Draft judgment</text>
      <text x="86" y="325">Human review</text>
      <text x="86" y="427">Later agent session</text>
      <text x="570" y="360">Enforcement hook</text>
    </g>
    <g font-size="16" fill="#3A4C4F">
      <text x="86" y="144">Capture guidance and choices from live or past work.</text>
      <text x="86" y="246">AJF records the choice, why, when and source.</text>
      <text x="86" y="348">Edit, approve or reject the draft.</text>
      <text x="86" y="450">Reuse approved judgments that match the task.</text>
      <text x="570" y="387">Check covered actions against</text>
      <text x="570" y="409">the exact approved version.</text>
      <text x="570" y="446" fill="#285F6A" font-weight="700">Pass or pause the action.</text>
    </g>
    <text x="570" y="331" font-size="12" fill="#336873" font-weight="700" letter-spacing="1.3">OPTIONAL HOST INTEGRATION</text>
  </g>
</svg>
