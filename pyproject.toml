[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "judgment-layer"
version = "0.1.0a5"
description = "Local, manual-first governance for human and agent judgments"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["jsonschema>=4.23,<5"]

[project.scripts]
proofpress = "judgment_layer.cli:main"
judgment = "judgment_layer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
judgment_layer = ["*.json", "skill/*.md", "skill/references/*.md", "skill/references/*.json"]
